<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHUBAI</title>

<style>
body{
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial;
    text-align:center;
}

main{
    min-height:100vh;
    padding:40px 20px;
    background:linear-gradient(#0008,#000),url("https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&w=1200&q=80");
    background-size:cover;
}

h1{
    color:#d4af37;
    font-size:60px;
}

button{
    display:block;
    width:100%;
    max-width:500px;
    margin:18px auto;
    padding:20px;
    border-radius:18px;
    background:#080808;
    color:white;
    border:2px solid #d4af37;
    font-size:20px;
}

#cadastro{
    display:none;
    max-width:450px;
    margin:20px auto;
    padding:20px;
    background:#111;
    border:2px solid #d4af37;
    border-radius:18px;
}

input{
    display:block;
    width:90%;
    margin:10px auto;
    padding:14px;
    border-radius:8px;
}

</style>
</head>

<body>

<main>

    <div style="margin:20px auto;text-align:center;">
    <p style="color:#d4af37;">🎵 MÚSICA DHUBAI</p>

    <iframe
        width="100%"
        height="80"
        src="https://www.youtube.com/embed/AFJKA83kwEs"
        title="Música DHUBAI"
        frameborder="0"
        allow="autoplay; encrypted-media"
        allowfullscreen>
    </iframe>
    </div>

<h1>♛ DHUBAI</h1>

<p>UNIÃO • RESPEITO • LEALDADE</p>

<button onclick="abrirCadastro()">📄 CADASTRO</button>

<button onclick="abrirLogin()">
🔐 LOGAR



<button onclick="alert('Área dos administradores')">
🛡️ ADMINS
</button>

<button onclick="alert('🕐 Ponto registrado!')">
🕐 BATER PONTO
</button>

<div id="cadastro">

<h2>CADASTRO DHUBAI</h2>

<input id="nome" placeholder="Nome">

<input id="nick" placeholder="Nick">

<input id="discord" placeholder="Discord">

<input id="senha" type="password" placeholder="Senha">

<button onclick="enviarCadastro()">
ENVIAR CADASTRO
</button>

</div>

</main>

<script>

function abrirCadastro(){
    document.getElementById("cadastro").style.display="block";
}

function enviarCadastro(){

    let nome=document.getElementById("nome").value;
    let nick=document.getElementById("nick").value;
    let discord=document.getElementById("discord").value;
    let senha=document.getElementById("senha").value;

    if(nome==="" || nick==="" || discord==="" || senha===""){
        alert("Preencha todos os campos!");
        return;
    }

    alert("✅ Cadastro enviado com sucesso!");

}

</script>
<button onclick="abrirLogin()">
🔐 LOGAR

</body>
</html>
