<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DHUBAI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#000;
    color:white;
}

.hero{
    min-height:100vh;
    padding:50px 20px;
    background:
    linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,.95)),
    url("https://images.unsplash.com/photo-1512453979798-5ea266f8880c?auto=format&fit=crop&w=1400&q=90");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

.container{
    width:100%;
    max-width:650px;
    margin:auto;
    text-align:center;
}

.logo{
    margin-top:30px;
    font-size:70px;
    font-weight:900;
    font-style:italic;
    letter-spacing:5px;
    color:#d4af37;
    text-shadow:0 0 20px #8c6b13;
}

.coroa{
    font-size:45px;
    color:#d4af37;
}

.frase{
    margin-top:10px;
    font-size:15px;
    letter-spacing:4px;
    color:#eee;
}

.linha{
    width:80%;
    height:2px;
    background:#d4af37;
    margin:25px auto;
}

.botao{
    width:100%;
    margin:18px 0;
    padding:23px 15px;
    border-radius:25px;
    background:rgba(0,0,0,.82);
    cursor:pointer;
    transition:.2s;
}

.botao:hover{
    transform:scale(1.02);
}

.botao h2{
    font-size:26px;
}

.botao p{
    margin-top:8px;
    color:#aaa;
    font-size:16px;
}

.cadastro{
    border:2px solid #d4af37;
    box-shadow:0 0 10px #d4af37;
}

.cadastro h2{
    color:#d4af37;
}

.login{
    border:2px solid #1478ff;
}

.login h2{
    color:#1478ff;
}

.admin{
    border:2px solid #e00000;
}

.admin h2{
    color:#ff3030;
}

.ponto{
    border:2px solid #00c853;
}

.ponto h2{
    color:#00e676;
}

#status{
    margin-top:15px;
    font-size:16px;
    color:#00e676;
}

.rodape{
    margin-top:40px;
    color:#777;
    font-size:13px;
    letter-spacing:4px;
}
</style>
</head>

<body>

<section class="hero">

<div class="container">

<div class="coroa">♛</div>

<div class="logo">
DHUBAI
</div>

<div class="frase">
🤝 UNIÃO • RESPEITO • LEALDADE
</div>

<div class="linha"></div>

<div class="botao cadastro" onclick="cadastro()">
<h2>📄 CADASTRO</h2>
<p>Faça seu cadastro na família</p>
</div>

<div class="botao login" onclick="login()">
<h2>🔐 LOGAR</h2>
<p>Acesse sua área de membro</p>
</div>

<div class="botao admin" onclick="admin()">
<h2>🛡️ ADMINS</h2>
<p>Área exclusiva da administração</p>
</div>

<div class="botao ponto" onclick="baterPonto()">
<h2>🕐 BATER PONTO</h2>
<p>Registrar entrada ou saída</p>
</div>

<div id="status"></div>

<div class="rodape">
DHUBAI • 2026
</div>

</div>
</section>

<script>

function cadastro(){
    alert("Área de cadastro em breve!");
}

function login(){
    alert("Área de login em breve!");
}

function admin(){
    alert("Área exclusiva dos administradores!");
}

function baterPonto(){

    let agora = new Date();

    let horario = agora.toLocaleTimeString("pt-BR");

    let ultimo = localStorage.getItem("ponto");

    if(!ultimo){

        localStorage.setItem("ponto", horario);

        document.getElementById("status").innerHTML =
        "🟢 Entrada registrada às " + horario;

        alert("🟢 PONTO DE ENTRADA REGISTRADO!");

    }else{

        localStorage.removeItem("ponto");

        document.getElementById("status").innerHTML =
        "🔴 Saída registrada às " + horario;

        alert("🔴 PONTO DE SAÍDA REGISTRADO!");

    }
}

</script>

</body>
</html>
